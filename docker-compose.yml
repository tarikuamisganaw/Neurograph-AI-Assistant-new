version: '3.8'

services:
  # --- Atomspace API ---
  atomspace-api:
    build:
      context: ./submodules/custom-atomspace-builder
      args:
        - API_PORT=${ATOMSPACE_API_PORT:-58000}
    image: tarikua123/custom-atom-space-builder-new-repo:latest
    container_name: atomspace-api
    ports:
      - "${ATOMSPACE_API_PORT:-58000}:58000"
    environment:
      - NEO4J_HOST=neo4j
      - NEO4J_PORT=7687
      - NEO4J_BOLT_PORT=7687
      - HUGEGRAPH_PORT=58080
      - ANNOTATION_SERVICE_URL=http://annotation_service:${ANNOTATION_SERVICE_PORT:-58001}/annotation/load
      - API_PORT=58000
      - MORK_URL=http://mork:8231
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_API_KEY=${LLM_API_KEY}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-atomspace123}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - HUGEGRAPH_HOST=hugegraph
      - HUGEGRAPH_GRAPH=${HUGEGRAPH_GRAPH:-hugegraph}
      - ANNOTATION_SERVICE_TIMEOUT=${ANNOTATION_SERVICE_TIMEOUT:-300.0}
    volumes:
      - ./custom-atomspace-builder/output:/app/output
      - atomspace_logs:/app/logs
      - ./custom-atomspace-builder/output:/shared/output
    depends_on:
      neo4j:
        condition: service_healthy
      hugegraph:
        condition: service_healthy
    networks:
      - atomspace-network
    restart: always

  # --- Neo4j ---
  neo4j:
    image: neo4j:5.15.0
    container_name: neo4j-atomspace
    ports:
      - "${NEO4J_HTTP_PORT:-57474}:7474"
      - "${NEO4J_BOLT_PORT:-57687}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-atomspace123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_dbms_security_allow__csv__import__from__file__urls=true
      - NEO4J_server_directories_import=/var/lib/neo4j/import
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
      - NEO4J_server_config_strict__validation_enabled=false
      - NEO4J_server_default__listen__address=0.0.0.0
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./custom-atomspace-builder/output:/var/lib/neo4j/import/shared/output
      - neo4j_plugins:/plugins
    networks:
      - atomspace-network
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "cypher-shell", "-u", "${NEO4J_USERNAME:-neo4j}", "-p", "${NEO4J_PASSWORD:-atomspace123}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- HugeGraph ---
  hugegraph:
    image: hugegraph/hugegraph:1.5.0
    container_name: hugegraph-atomspace
    ports:
      - "${HUGEGRAPH_PORT_EXTERNAL:-58080}:58080"
      - "${HUGEGRAPH_GREMLIN_PORT_EXTERNAL:-58182}:58182"
    environment:
      - HUGEGRAPH_CONF=/hugegraph-server/conf
    command: >
      bash -c "
      sed -i 's|restserver\.url=.*|restserver.url=http://0.0.0.0:58080|' /hugegraph-server/conf/rest-server.properties &&
      sed -i 's|8182|58182|g' /hugegraph-server/conf/rest-server.properties /hugegraph-server/conf/gremlin-server.yaml &&
      sed -i 's|host: localhost|host: 0.0.0.0|' /hugegraph-server/conf/gremlin-server.yaml &&
      /hugegraph-server/bin/init-store.sh &&
      /hugegraph-server/bin/start-hugegraph.sh &&
      tail -f /hugegraph-server/logs/*.log"
    volumes:
      - hugegraph_data:/hugegraph/data
      - hugegraph_logs:/hugegraph/logs
    networks:
      - atomspace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:58080/graphs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # --- Annotation Service (Backend) ---
  annotation_service:
    build:
      context: ./submodules/annotation-query-backend-general
      args:
        - APP_PORT=${ANNOTATION_SERVICE_PORT:-58001}
    image: tarikua123/annotation-query-backend-new-port
    container_name: annotation-service
    ports:
      - "${ANNOTATION_SERVICE_PORT:-58001}:58001"
    command: python run.py
    restart: always
    depends_on:
      - mongodb
      - redis
    environment:
      - MONGO_URI=mongodb://mongodb:27017/annotation
      - APP_PORT=58001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - REDIS_EXPIRATION=3600
      - MORK_URL=http://mork:8231
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-atomspace123}
      - LLM_MODEL=${LLM_MODEL:-gemini}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HURISTIC_SORT=False
    networks:
      - atomspace-network
    volumes:
      - ./custom-atomspace-builder/output:/shared/output

  # --- MongoDB (For Annotation) ---
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "${MONGO_PORT:-57017}:27017"
    volumes:
      - mongo_data:/data/db
    restart: always
    networks:
      - atomspace-network

  # --- Redis (For Annotation) ---
  redis:
    image: redis:latest
    container_name: redis
    # ports:
    #   - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - atomspace-network

  # --- Annotation Tool (Frontend) ---
  annotation-tool:
    build:
      context: ./submodules/annotation-tool
    image: tarikua123/annotation-tool-new-repo:latest
    container_name: annotation-tool
    ports:
      - "${ANNOTATION_TOOL_PORT:-53000}:${ANNOTATION_TOOL_PORT:-53000}"
    environment:
      - PORT=${ANNOTATION_TOOL_PORT:-53000}
      - LOADER_URL=http://127.0.0.1:${ATOMSPACE_API_PORT:-58000}
      - ANNOTATION_URL=http://127.0.0.1:${ANNOTATION_SERVICE_PORT:-58001}
      - INTEGRATION_URL=http://127.0.0.1:${INTEGRATION_API_PORT:-59000}
    depends_on:
      - atomspace-api
      - annotation_service
    network_mode: host
    restart: always

  # --- Mork Pathmap ---
  mork:
    image: deazstar/custom-query-builder:mork-pathmap
    container_name: mork_pathmap
    ports:
      - "${MORK_PORT:-58231}:8231"
    environment:
      - PORT=8231
    volumes:
      - ./custom-atomspace-builder/output:/shared/output # shared volume
    networks:
      - atomspace-network
    restart: always

  # --- Integration Service ---
  integration-service:
    build:
      context: ./integration_service
      args:
        - API_PORT=${INTEGRATION_API_PORT:-59000}
    image: tarikua123/integration-service-new-port
    container_name: neurograph-ai-assistant-integration-service
    ports:
      - "${INTEGRATION_API_PORT:-59000}:59000"
    environment:
      - API_PORT=${INTEGRATION_API_PORT:-59000}
      - ATOMSPACE_API_URL=http://atomspace-api:58000
      - NEURAL_MINER_URL=http://neural-miner:59002
      - ANNOTATION_SERVICE_URL=http://annotation_service:58001
      - ATOMSPACE_TIMEOUT=${ATOMSPACE_TIMEOUT:-600}
      - MINER_TIMEOUT=${MINER_TIMEOUT:-1800}
      - ANNOTATION_TIMEOUT=${ANNOTATION_TIMEOUT:-300}
      - CSV_CACHE_DIR=${CSV_CACHE_DIR:-./cache}
      - SHARED_VOLUME_PATH=/shared/output
    volumes:
      - ./custom-atomspace-builder/output:/shared/output
      - ./integration_service/output:/app/output
      - csv_cache:/tmp/csv_cache
    networks:
      - atomspace-network
    restart: always
    depends_on:
      - atomspace-api
      - neural-miner

  # --- Neural Subgraph Matcher Miner ---
  neural-miner:
    build:
      context: ./submodules/neural-subgraph-matcher-miner
    image: tarikua123/neural-miner-new-repo
    container_name: neurograph-ai-assistant-neural-miner
    volumes:
      - ./custom-atomspace-builder/output:/shared/output
      - ./submodules/neural-subgraph-matcher-miner/results:/app/results
      - ./submodules/neural-subgraph-matcher-miner/plots:/app/plots
    ports:
      - "${NEURAL_MINER_PORT:-59002}:59002"
    networks:
      - atomspace-network
    environment:
      - PORT=${NEURAL_MINER_PORT:-59002}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEURAL_MINER_PORT=${NEURAL_MINER_PORT:-59002}
      - ANNOTATION_TOOL_PORT=${ANNOTATION_TOOL_PORT:-53000}
    command: python3 -m app.main
    restart: always


volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  hugegraph_data:
  hugegraph_logs:
  atomspace_logs:
  shared_output:
  mongo_data:
  redis_data:
  csv_cache:

networks:
  atomspace-network:
    driver: bridge